package:
  name: tempo
  version: "0.2.1"

source:
  path: .

build:
  script:
    - mkdir -p $PREFIX/lib/mojo
    - cp -r tempo $PREFIX/lib/mojo/

requirements:
  host:
    - mojo >=1.1.0,<2.0.0
  run:
    - mojo >=1.1.0,<2.0.0

about:
  summary: Minimal Timestamp and Duration types for Mojo
  license: MIT
